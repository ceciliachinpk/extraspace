<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Profile | Extra Space Asia</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='9' fill='%2300245d'/><path d='M13 28.5V17.6L20 13l7 4.6v10.9' stroke='white' stroke-width='2.6' fill='none'/></svg>">
<link rel="stylesheet" href="assets/styles.css?v=4">
<style>
/* ---------- profile ---------- */
.prof{padding:16px 16px calc(24px + var(--safe-b));}

.id-card{
  display:flex;align-items:center;gap:16px;padding:16px;margin:0 0 16px;
  background:var(--brand-700);border-radius:var(--r-lg);color:#c3d5ee;
}
.avatar-lg{
  width:58px;height:58px;flex-shrink:0;border-radius:50%;background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:700;
  line-height:1;
}
.id-card h2{color:#fff;font-size:18px;margin:0 0 2px;}
.id-card p{margin:0;font-size:13px;}
.id-card .since{font-size:12px;color:#9db6dc;margin-top:3px;}

.prof-actions{display:flex;gap:8px;margin:0 0 8px;}
.prof-actions .btn{flex:1;min-height:44px;font-size:14px;}

.grp{margin:24px 0 0;}
.grp-title{
  font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin:0 0 8px 2px;
}
.rows{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;}
.row{
  display:flex;align-items:center;gap:12px;width:100%;padding:16px 16px;
  border:0;border-bottom:1px solid var(--line);background:none;text-align:left;
  color:inherit;font:inherit;cursor:pointer;
}
.row:last-child{border-bottom:0;}
.row:active{background:var(--sand);}
.row .ic{
  width:36px;height:36px;flex-shrink:0;border-radius:var(--r-sm);background:var(--brand-050);
  color:var(--brand-500);display:flex;align-items:center;justify-content:center;
}
.row .txt{flex:1;min-width:0;}
.row strong{display:block;font-size:14.5px;color:var(--ink);font-weight:600;}
.row span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .chev{flex-shrink:0;color:var(--muted);}
.row.static{cursor:default;}
.row.static:active{background:none;}
.row .switch{margin-left:auto;}

.ver{text-align:center;font-size:12px;color:var(--muted);margin:22px 0 0;}

/* the wall, when nobody is signed in */
.wall{padding:8px 16px calc(28px + var(--safe-b));}
.wall-preview{position:relative;margin:0 0 22px;}
.wall-preview .peek{filter:blur(5px);opacity:.55;pointer-events:none;user-select:none;}
.wall-lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;text-align:center;}
.wall-lock .ic{width:52px;height:52px;border-radius:50%;background:var(--card);box-shadow:var(--sh-md);
  display:flex;align-items:center;justify-content:center;color:var(--brand-500);}
.wall-lock .tag{background:var(--card);box-shadow:var(--sh-sm);border-radius:var(--r-pill);
  font-size:12px;font-weight:700;color:var(--ink);padding:8px 12px;}
.wall h1{font-size:22px;margin:0 0 6px;}
.wall .reason{font-size:14.5px;margin:0 0 18px;}
.wall-perks{margin:0 0 22px;}
.wall-perks li{display:flex;gap:12px;padding:8px 0;font-size:14px;border-bottom:1px solid var(--line);}
.wall-perks li:last-child{border-bottom:0;}
.wall-perks .ic{width:34px;height:34px;flex-shrink:0;border-radius:var(--r-sm);background:var(--brand-050);
  color:var(--brand-500);display:flex;align-items:center;justify-content:center;}
.wall-perks strong{display:block;color:var(--ink);font-size:14px;}
.wall-perks span{font-size:12.5px;color:var(--muted);}
</style>
</head>
<body>
<div class="app">

  <header class="appbar">
    <a class="icon-btn" href="home.html" aria-label="Back">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 5-7 7 7 7"/></svg>
    </a>
    <h1>Profile</h1>
    <button class="icon-btn" type="button" id="edit-btn" aria-label="Edit profile" hidden>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="m14.5 5.5 4 4"/></svg>
    </button>
    <span class="icon-btn" id="appbar-spacer" aria-hidden="true"></span>
  </header>

  <main class="screen" id="screen"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="home.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1Z"/></svg>
      Home
    </a>
    <a href="map.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg>
      Locations
    </a>
    <a href="account.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="3.5" y="7.5" width="17" height="12" rx="2"/><path d="M3.5 12h17M9 7.5V5h6v2.5"/></svg>
      My storage
    </a>
    <a href="profile.html" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
      Account
    </a>
  </nav>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/profile.js"></script>
</body>
</html>
