<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Booking | Extra Space Asia</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='9' fill='%2300245d'/><path d='M13 28.5V17.6L20 13l7 4.6v10.9' stroke='white' stroke-width='2.6' fill='none'/></svg>">
<link rel="stylesheet" href="assets/styles.css?v=4">
<style>
/* ---------- booking detail ---------- */
.bk{padding:16px 16px calc(20px + var(--safe-b));}
.bk-head{
  padding:16px;border-radius:var(--r-lg);background:var(--brand-700);color:#c3d5ee;margin:0 0 14px;
}
.bk-head .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.bk-head h2{color:#fff;font-size:18px;margin:0 0 3px;}
.bk-head p{margin:0;font-size:13px;}
.bk-head .facts{display:flex;flex-wrap:wrap;gap:8px 24px;margin:14px 0 0;padding-top:12px;
  border-top:1px solid rgba(255,255,255,.16);}
.bk-head .fact{font-size:12.5px;}
.bk-head .fact strong{display:block;color:#fff;font-size:13.5px;font-weight:600;margin-top:1px;}

.alert-bar{
  display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--r-md);
  background:#fff3dc;border:1px solid #f0dcb0;color:#6b4708;font-size:13px;margin:0 0 14px;
}
.alert-bar .ic{flex-shrink:0;margin-top:1px;}
.alert-bar strong{display:block;color:#4d3305;font-size:14px;margin-bottom:2px;}
.alert-bar button{background:none;border:0;padding:0;margin-top:8px;font-size:13px;
  font-weight:700;color:#8a5a05;text-decoration:underline;cursor:pointer;}

.inv{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);}
.inv:last-child{border-bottom:0;}
.inv .txt{flex:1;min-width:0;}
.inv strong{display:block;font-size:14px;color:var(--ink);}
.inv span{font-size:12.5px;color:var(--muted);}
.inv .amt{font-size:15px;font-weight:700;color:var(--ink);text-align:right;}
.inv .paid{display:block;font-size:11.5px;font-weight:700;color:#12704a;margin-top:2px;}
.inv .dl{flex-shrink:0;color:var(--muted);background:none;border:0;cursor:pointer;padding:8px;}

.acct-row.danger strong{color:var(--accent-500);}
.acct-row.danger .ic{background:var(--accent-050);color:var(--accent-500);}

.opt{
  display:flex;align-items:flex-start;gap:12px;padding:16px;border:1.5px solid var(--line);
  border-radius:var(--r-md);margin-bottom:10px;cursor:pointer;
}
.opt.sel{border-color:var(--brand-500);background:var(--brand-050);}
.opt .mark{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);
  background:#fff;margin-top:1px;}
.opt.sel .mark{border:7px solid var(--brand-500);}
.opt strong{display:block;font-size:15px;color:var(--ink);}
.opt span{font-size:12.5px;color:var(--muted);}
.opt .price{margin-left:auto;text-align:right;font-size:15px;}
.opt input{position:absolute;opacity:0;width:0;height:0;}

.notice{background:var(--sand);border-radius:var(--r-md);padding:12px 16px;font-size:13px;
  line-height:1.5;margin:0 0 16px;}
.notice strong{display:block;color:var(--ink);margin-bottom:3px;}
.confirm{text-align:center;padding:8px 0 4px;}
.confirm .tick{width:56px;height:56px;border-radius:50%;background:var(--brand-050);color:var(--brand-500);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
</style>
</head>
<body>
<div class="app">

  <header class="appbar">
    <a class="icon-btn" href="account.html" aria-label="Back to My storage">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 5-7 7 7 7"/></svg>
    </a>
    <h1 id="bar-title">Booking</h1>
    <span class="icon-btn" aria-hidden="true"></span>
  </header>

  <main class="screen" id="screen"></main>

  <div class="cta-bar" id="cta-bar" hidden>
    <div>
      <div class="price" id="cta-price">&mdash;</div>
      <div class="hint" id="cta-note" style="margin:0">Next invoice</div>
    </div>
    <button class="btn btn-accent" type="button" id="pay-btn" style="flex:1">Pay now</button>
  </div>

  <!-- extend booking -->
  <div class="sheet-backdrop" id="extend-sheet-backdrop"></div>
  <section class="sheet" id="extend-sheet" role="dialog" aria-modal="true" aria-labelledby="extend-title" aria-hidden="true">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head">
      <div><h2 id="extend-title">Extend booking</h2>
        <p class="hint" id="extend-sub" style="margin:2px 0 0"></p></div>
      <button class="icon-btn" type="button" data-sheet-close aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="extend-body"></div>
  </section>

  <!-- end booking -->
  <div class="sheet-backdrop" id="end-sheet-backdrop"></div>
  <section class="sheet" id="end-sheet" role="dialog" aria-modal="true" aria-labelledby="end-title" aria-hidden="true">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head">
      <div><h2 id="end-title">End booking</h2>
        <p class="hint" id="end-sub" style="margin:2px 0 0"></p></div>
      <button class="icon-btn" type="button" data-sheet-close aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="end-body"></div>
  </section>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/booking.js"></script>
</body>
</html>
