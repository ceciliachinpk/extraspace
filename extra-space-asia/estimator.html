<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Size estimator | Extra Space Asia</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='9' fill='%2300245d'/><path d='M13 28.5V17.6L20 13l7 4.6v10.9' stroke='white' stroke-width='2.6' fill='none'/></svg>">
<link rel="stylesheet" href="assets/styles.css?v=4">
<style>
/* ---------- size estimator ---------- */
.est{padding:0 16px calc(20px + var(--safe-b));}
.est-intro{padding:16px 0 4px;}
.est-intro h1{font-size:21px;margin:0 0 4px;}
.est-intro p{font-size:14px;margin:0;}

.seg{display:flex;background:var(--sand);border-radius:var(--r-pill);padding:4px;margin:16px 0 18px;}
.seg button{
  flex:1;background:none;border:0;border-radius:var(--r-pill);padding:12px 8px;
  font-size:14.5px;font-weight:700;color:var(--body);cursor:pointer;
}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh-sm);}

.preset{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-md);
  padding:16px;margin-bottom:10px;font:inherit;
}
.preset.sel{border-color:var(--brand-500);background:var(--brand-050);}
.preset .mark{flex-shrink:0;width:22px;height:22px;border-radius:50%;
  border:1.5px solid var(--line-strong);background:#fff;}
.preset.sel .mark{border:7px solid var(--brand-500);}
.preset strong{display:block;font-size:15px;color:var(--ink);}
.preset span{font-size:12.5px;color:var(--muted);}

.grp{margin:0 0 16px;}
.grp h2{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin:0 0 8px 2px;}
.grp .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);}
.item:last-child{border-bottom:0;}
.item.on{background:var(--brand-050);}
.item .ico{
  width:46px;height:46px;flex-shrink:0;border-radius:var(--r-sm);background:var(--sand);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.item .ico img{width:40px;height:40px;object-fit:contain;display:block;}
.item.on .ico{background:#fff;}
.item .txt{flex:1;min-width:0;}
.item strong{display:block;font-size:14.5px;color:var(--ink);font-weight:600;}
.item span{font-size:12px;color:var(--muted);}

.result{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:16px;margin:18px 0 0;box-shadow:var(--sh-sm);
}
.result .lead{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--brand-500);margin:0 0 4px;}
.result h2{font-size:26px;margin:0 0 2px;}
.result .sub{font-size:13.5px;color:var(--muted);margin:0 0 16px;}
.result .meter{margin:0 0 6px;}
.result .meter-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:7px;}
.result .up{
  display:flex;gap:8px;align-items:flex-start;margin:16px 0 0;padding:12px;border-radius:var(--r-md);
  background:var(--sand);font-size:13px;line-height:1.45;
}
.result .up strong{color:var(--ink);}
.est-reset{display:block;width:100%;background:none;border:0;text-align:center;cursor:pointer;
  font-size:13.5px;font-weight:700;color:var(--muted);padding:16px 0 0;}
[hidden]{display:none !important;}
</style>
</head>
<body>
<div class="app">

  <header class="appbar">
    <a class="icon-btn" href="home.html" aria-label="Back">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 5-7 7 7 7"/></svg>
    </a>
    <h1>Size estimator</h1>
    <button class="icon-btn" type="button" id="signin-btn" aria-label="Sign in">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
    </button>
  </header>

  <main class="screen" id="screen">
    <div class="est">
      <div class="est-intro">
        <h1>How much space do you need?</h1>
        <p>Pick a home size for a quick answer, or add your items for a closer estimate.</p>
      </div>

      <div class="seg" role="tablist" aria-label="Estimate method">
        <button type="button" role="tab" id="tab-home" aria-selected="true" aria-controls="panel-home">By home size</button>
        <button type="button" role="tab" id="tab-items" aria-selected="false" aria-controls="panel-items">By items</button>
      </div>

      <section id="panel-home" role="tabpanel" aria-labelledby="tab-home"></section>
      <section id="panel-items" role="tabpanel" aria-labelledby="tab-items" hidden></section>

      <div id="result"></div>
      <button class="est-reset" type="button" id="reset" hidden>Start over</button>
    </div>
  </main>

  <div class="cta-bar" id="cta-bar">
    <div>
      <div class="price" id="cta-size">&mdash;</div>
      <div class="hint" id="cta-note" style="margin:0">Choose what you&rsquo;re storing</div>
    </div>
    <a class="btn btn-accent" id="cta-go" href="map.html" style="flex:1;pointer-events:none;opacity:.45">See units</a>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/estimator.js"></script>
</body>
</html>
